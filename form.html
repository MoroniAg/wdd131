<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Form, Moroni Aguilera</title>
    <meta name="description" content="Contact form and project information.">
    <meta name="author" content="Moroni Aguilera">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form id="reviewForm" action="review.html" method="get">
            <div>
                <label for="product">Product Name</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>
            <div>
                <label for="rating">Overall Rating</label>
                <div id="rating" class="rating" role="radiogroup" aria-required="true">
                    <label for="rating-5">
                        <input type="radio" id="rating-5" name="rating" value="5" required>
                        <span class="control" aria-hidden></span>
                        <span class="label-text" aria-hidden="true">★★★★★</span>
                    </label>
                    <label for="rating-4">
                        <input type="radio" id="rating-4" name="rating" value="4">
                        <span class="control" aria-hidden></span>
                        <span class="label-text" aria-hidden="true">★★★★☆</span>
                    </label>
                    <label for="rating-3">
                        <input type="radio" id="rating-3" name="rating" value="3">
                        <span class="control" aria-hidden></span>
                        <span class="label-text" aria-hidden="true">★★★☆☆</span>
                    </label>
                    <label for="rating-2">
                        <input type="radio" id="rating-2" name="rating" value="2">
                        <span class="control" aria-hidden></span>
                        <span class="label-text" aria-hidden="true">★★☆☆☆</span>
                    </label>
                    <label for="rating-1">
                        <input type="radio" id="rating-1" name="rating" value="1">
                        <span class="control" aria-hidden></span>
                        <span class="label-text" aria-hidden="true">★☆☆☆☆</span>
                    </label>
                </div>
            </div>
            <div>
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>
            <div>
                <label id="features-label">Useful Features (select all that apply)</label>
                <div id="features" class="features" role="group" aria-labelledby="features-label">
                    <label for="f-timer">
                        <input type="checkbox" id="f-timer" name="features" value="timer">
                        <span class="control" aria-hidden></span>
                        <span class="label-text">Durability</span>
                    </label>
                    <label for="f-search">
                        <input type="checkbox" id="f-search" name="features" value="search">
                        <span class="control" aria-hidden></span>
                        <span class="label-text">Easy of use</span>
                    </label>
                    <label for="f-fav">
                        <input type="checkbox" id="f-fav" name="features" value="favorites">
                        <span class="control" aria-hidden></span>
                        <span class="label-text">Performance</span>
                    </label>
                    <label for="f-responsive">
                        <input type="checkbox" id="f-responsive" name="features" value="responsive">
                        <span class="control" aria-hidden></span>
                        <span class="label-text">Design</span>
                    </label>
                </div>
            </div>
            <div>
                <label for="review">Written Review (optional)</label>
                <textarea id="review" name="review" rows="6" cols="40"></textarea>
            </div>
            <div>
                <label for="username">Your Name (optional)</label>
                <input type="text" id="username" name="username">
            </div>
            <div class="actions">
                <input type="submit" value="Submit Review">
            </div>

        </form>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> Moroni Aguilera — Ambato, Ecuador</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
